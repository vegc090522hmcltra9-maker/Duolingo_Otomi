<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="otomi.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="estilo_axl.css">
<title>Lección Rosa</title>
<style>
.contenedor{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:12px; max-width:600px; margin:0 auto;}
.card{border:2px solid #e5e5e5;border-bottom:5px solid #e5e5e5;border-radius:16px;padding:10px;text-align:center;cursor:pointer;background:#fff}
.card.seleccionada{border-color:#1cb0f6;background:#ddf4ff}
.card img{width:100%;height:90px;object-fit:cover;border-radius:10px}
.botones-accion{display:flex;justify-content:space-between;padding:16px; max-width:600px; margin:0 auto; border-top:2px solid #e5e5e5; margin-top:20px;}
button{padding:12px 16px;border-radius:12px;border:2px solid #e5e5e5;font-weight:800;cursor:pointer;background:#fff}
button.verde{background:#58cc02;color:#fff;border-color:#58a700;box-shadow:0 4px 0 #58a700}
h3{color:#777; text-align:center}
h1{text-align:center; color:#4b4b4b;}
</style>
</head>
<body>

<div style="width:90%;height:16px;background:#e5e5e5;border-radius:8px;overflow:hidden;margin:14px auto">
<div id="fill" style="height:100%;background:#58cc02;width:33%;transition:.5s"></div>
</div>

<h3>Palabra nueva</h3>
<h1>CUAL DE ESTOS ES EL ROSA?</h1>

<div class="contenedor">

    <div class="card" onclick="seleccionar(this, 'Roxa')">
        <img src="img/papa-blanca_580x.webp" onerror="this.src='https://via.placeholder.com/150?text=ROSA'">
        <h3>1</h3>
        <button onclick="event.stopPropagation(); seleccionar(this.closest('.card'), 'Roxa'); correcto();">ROKA</button>
        <audio controls style="width:100%; height:30px; margin-top:8px;" onclick="event.stopPropagation()">
            <source src="./audio/Roxa.ogg" type="audio/ogg">
            <source src="./audio/Roxa.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" onclick="seleccionar(this, 'naranxa')">
        <img src="img/orange-fruit-cartoon-illustration-vector.jpg" onerror="this.src='https://via.placeholder.com/150?text=NARANJA'">
        <h3>2</h3>
        <button onclick="event.stopPropagation(); seleccionar(this.closest('.card'), 'naranxa'); incorrecto();">NARANXA</button>
        <audio controls style="width:100%; height:30px; margin-top:8px;" onclick="event.stopPropagation()">
            <source src="./audio/naranxa.ogg" type="audio/ogg">
            <source src="./audio/naranxa.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" onclick="seleccionar(this, 'kjuföi')">
        <img src="img/Morado.webp" onerror="this.src='https://via.placeholder.com/150?text=MORADO'">
        <h3>3</h3>
        <button onclick="event.stopPropagation(); seleccionar(this.closest('.card'), 'kjuföi'); incorrecto();">KJUFÖI</button>
        <audio controls style="width:100%; height:30px; margin-top:8px;" onclick="event.stopPropagation()">
            <source src="./audio/kjuföi.ogg" type="audio/ogg">
            <source src="./audio/kjuföi.mp3" type="audio/mpeg">
        </audio>
    </div>

</div>

<div class="botones-accion">
<button onclick="alert('Saltado')">Saltar</button>
<button class="verde" onclick="comprobar()">Comprobar</button>
</div>

<audio id="player"></audio>

<script>
let seleccion = null;
function seleccionar(card, audioNombre){
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('seleccionada'));
    card.classList.add('seleccionada');
    seleccion = audioNombre;
    const player = document.getElementById('player');
    player.src = `./audio/${audioNombre}.ogg`;
    player.play().catch(()=>{
        player.src = `./audio/${audioNombre}.mp3`;
        player.play();
    });
}
function correcto(){
    document.getElementById('fill').style.width='100%';
    alert('¡Correcto! ROKA es rosa');
}
function incorrecto(){
    alert('Incorrecto');
}
function comprobar(){
    if(!seleccion){ alert('Elige una primero 🔊'); return; }
    if(seleccion.toLowerCase() === 'roxa'){
        correcto();
    } else {
        incorrecto();
    }
}
</script>

</body>
</html>
