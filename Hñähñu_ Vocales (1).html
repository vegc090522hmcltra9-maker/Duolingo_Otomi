<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hñähñu: Vocales</title>
    <link rel="stylesheet" href="otomi.css">
    <style>
        :root {
            --bg: #fff;
            --fg: #3c3c3c;
            --mut: #777;
            --line: #e5e5e5;
            --green: #58cc02;
            --gd: #58a700;
            --red: #ff4b4b;
            --blue: #1cb0f6;
            --okbg: #d7ffb8;
            --okfg: #58a700;
            --badbg: #ffdfe0;
            --badfg: #ea2b2b;
            --card: #f7f7f7;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #131f24;
                --fg: #f1f7fb;
                --mut: #a0aab0;
                --line: #37464f;
                --okbg: #1d3a14;
                --okfg: #89e219;
                --badbg: #3a1a1c;
                --badfg: #ff7878;
                --card: #1f2c33;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #131f24;
            --fg: #f1f7fb;
            --mut: #a0aab0;
            --line: #37464f;
            --okbg: #1d3a14;
            --okfg: #89e219;
            --badbg: #3a1a1c;
            --badfg: #ff7878;
            --card: #1f2c33;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center
        }

        #app {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            height: 100%
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px
        }

        .bar {
            flex: 1;
            height: 16px;
            background: var(--line);
            border-radius: 8px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--green);
            border-radius: 8px;
            transition: width .3s
        }

        .hearts {
            font-weight: 800;
            color: var(--red)
        }

        main {
            flex: 1;
            overflow: auto;
            padding: 8px 20px 20px
        }

        h1 {
            font-size: 1.6rem;
            margin: 8px 0 4px
        }

        .sub {
            color: var(--mut);
            margin: 0 0 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px
        }

        .v {
            background: var(--card);
            border: 2px solid var(--line);
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 12px;
            text-align: center
        }

        .v b {
            font-size: 2.2rem;
            display: block;
            color: var(--blue)
        }

        .v small {
            color: var(--mut)
        }

        .opts {
            display: grid;
            gap: 10px;
            margin-top: 16px
        }

        .opt {
            font: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--fg);
            background: var(--bg);
            border: 2px solid var(--line);
            border-bottom-width: 4px;
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            text-align: left
        }

        .opt.sel {
            border-color: var(--blue);
            background: var(--card)
        }

        .opt.ok {
            border-color: var(--green)
        }

        .opt.no {
            border-color: var(--red)
        }

        .q {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 8px 0
        }

        .word {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--blue);
            text-align: center;
            margin: 20px 0
        }

        .pairs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px
        }

        .tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 56px;
            border-bottom: 2px solid var(--line);
            padding: 6px 0;
            margin: 16px 0
        }

        .tile {
            font: inherit;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--fg);
            background: var(--bg);
            border: 2px solid var(--line);
            border-bottom-width: 4px;
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer
        }

        footer {
            padding: 16px 20px;
            border-top: 2px solid var(--line)
        }

        footer.ok {
            background: var(--okbg);
            color: var(--okfg)
        }

        footer.no {
            background: var(--badbg);
            color: var(--badfg)
        }

        .fb {
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 10px;
            min-height: 0
        }

        .btn {
            width: 100%;
            font: inherit;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: #fff;
            background: var(--green);
            border: 0;
            border-bottom: 4px solid var(--gd);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer
        }

        .btn:disabled {
            background: var(--line);
            border-color: var(--line);
            color: var(--mut);
            cursor: default
        }

        footer.no .btn {
            background: var(--red);
            border-color: #ea2b2b
        }

        .end {
            text-align: center;
            padding-top: 40px
        }

        .end .big {
            font-size: 4rem
        }

        .note {
            font-size: .85rem;
            color: var(--mut);
            margin-top: 20px
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="top">
            <div class="bar"><i id="pb"></i></div>
            <div class="hearts" id="hp">❤ 5</div>
        </div>
        <main id="main"></main>
        <footer id="ft">
            <div class="fb" id="fb"></div><button class="btn" id="go">Continuar</button>
        </footer>
    </div>
    <script>
        const V = [["a", "como en español"], ["e", "como en español"], ["i", "como en español"], ["o", "como en español"], ["u", "como en español"], ["ä", "vocal con diéresis"], ["ë", "vocal con diéresis"], ["ö", "vocal con diéresis"], ["ü", "vocal con diéresis"]];
        const S = [
            { t: "learn" },
            { t: "mc", q: "¿Cuál de estas letras es una vocal del hñähñu?", o: ["ä", "ñ", "h", "t"], a: 0 },
            { t: "mc", q: "¿Qué signo llevan ä, ë, ö y ü?", o: ["Diéresis (¨)", "Acento (´)", "Tilde (~)", "Ninguno"], a: 0 },
            { t: "mc", q: "¿Cuántas vocales sencillas, como las del español, tiene el hñähñu?", o: ["3", "5", "7", "10"], a: 1 },
            { t: "word", w: "dada", q: "¿Qué vocal se repite en esta palabra? (dada = papá)", o: ["a", "e", "o", "u"], a: 0 },
            { t: "word", w: "hñähñu", q: "¿Qué vocales tiene hñähñu? (el nombre de la lengua)", o: ["ä y u", "e y o", "i y a", "ö y ü"], a: 0 },
            { t: "pair", q: "Une cada palabra con su significado", p: [["dada", "papá"], ["nana", "mamá"], ["ngu", "casa"]] },
            { t: "build", q: "Forma la palabra «casa» en hñähñu", w: "ngu", tiles: ["u", "n", "g", "a"] }
        ];
        let i = 0, hearts = 5, xp = 0, sel = null, done = false, built = [], pairSel = null, pairDone = [];
        const $ = id => document.getElementById(id), main = $("main"), ft = $("ft"), fb = $("fb"), go = $("go");
        function shuffle(a) { return a.map(x => [Math.random(), x]).sort((x, y) => x[0] - y[0]).map(x => x[1]) }
        function status() { $("pb").style.width = (i / S.length * 100) + "%"; $("hp").textContent = "❤ " + hearts }
        function render() {
            status(); done = false; sel = null; built = []; pairSel = null; pairDone = []; ft.className = ""; fb.textContent = "";
            if (hearts <= 0) return end(false);
            if (i >= S.length) return end(true);
            const s = S[i]; go.disabled = true; go.textContent = "Comprobar";
            if (s.t == "learn") {
                main.innerHTML = '<h1>Las vocales del hñähñu</h1><p class="sub">El hñähñu (otomí del Valle del Mezquital) tiene las 5 vocales del español y otras con diéresis.</p><div class="grid">' + V.map(v => '<div class="v"><b>' + v[0] + '</b><small>' + v[1] + '</small></div>').join("") + '</div><p class="note">Esta lección es de práctica de lectura y escritura. Para la pronunciación exacta, escucha a una persona hablante.</p>';
                go.disabled = false; go.textContent = "Empezar";
            } else if (s.t == "mc" || s.t == "word") {
                main.innerHTML = '<div class="q">' + s.q + '</div>' + (s.w ? '<div class="word">' + s.w + '</div>' : '') + '<div class="opts" id="ops"></div>';
                const order = shuffle(s.o.map((x, k) => k));
                order.forEach(k => { const b = document.createElement("button"); b.className = "opt"; b.textContent = s.o[k]; b.onclick = () => { if (done) return; sel = k;[...$("ops").children].forEach(c => c.classList.remove("sel")); b.classList.add("sel"); go.disabled = false }; b.dataset.k = k; $("ops").appendChild(b) });
            } else if (s.t == "pair") {
                const L = shuffle(s.p.map(x => x[0])), R = shuffle(s.p.map(x => x[1]));
                main.innerHTML = '<div class="q">' + s.q + '</div><div class="pairs" id="pr"></div>';
                const mk = (txt, side) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = txt; b.dataset.side = side; b.onclick = () => pick(b, txt, side); return b };
                for (let k = 0; k < L.length; k++) { $("pr").appendChild(mk(L[k], "l")); $("pr").appendChild(mk(R[k], "r")) }
            } else if (s.t == "build") {
                main.innerHTML = '<div class="q">' + s.q + '</div><div class="tiles" id="ans"></div><div class="tiles" id="bank" style="border:0"></div>'; drawBuild();
            }
        }
        function pick(b, txt, side) {
            if (b.classList.contains("ok")) return;
            if (!pairSel || pairSel.side == side) { [...document.querySelectorAll("#pr .sel")].forEach(x => x.classList.remove("sel")); b.classList.add("sel"); pairSel = { b, txt, side }; return }
            const l = side == "l" ? txt : pairSel.txt, r = side == "r" ? txt : pairSel.txt, good = S[i].p.some(p => p[0] == l && p[1] == r);
            if (good) { b.classList.add("ok"); pairSel.b.classList.add("ok"); b.classList.remove("sel"); pairSel.b.classList.remove("sel"); pairDone.push(l); if (pairDone.length == S[i].p.length) { go.disabled = false; done = true; check(true) } }
            else { b.classList.add("no"); pairSel.b.classList.add("no"); const a = b, c = pairSel.b; setTimeout(() => { a.classList.remove("no", "sel"); c.classList.remove("no", "sel") }, 500); hearts--; status(); if (hearts <= 0) setTimeout(render, 600) }
            pairSel = null;
        }
        function drawBuild() {
            const w = S[i].tiles.filter((t, k) => !built.includes(k));
            $("ans").innerHTML = ""; $("bank").innerHTML = "";
            built.forEach(k => { const b = document.createElement("button"); b.className = "tile"; b.textContent = S[i].tiles[k]; b.onclick = () => { if (done) return; built = built.filter(x => x != k); drawBuild() }; $("ans").appendChild(b) });
            S[i].tiles.forEach((t, k) => { if (built.includes(k)) return; const b = document.createElement("button"); b.className = "tile"; b.textContent = t; b.onclick = () => { if (done) return; built.push(k); drawBuild() }; $("bank").appendChild(b) });
            go.disabled = built.length == 0;
        }
        function check(ok) {
            ft.className = ok ? "ok" : "no";
            if (ok) { xp += 10; fb.textContent = "¡Correcto! +10 XP" } else { hearts--; fb.textContent = "Incorrecto"; status() }
            go.textContent = "Continuar"; go.disabled = false; done = true;
        }
        go.onclick = () => {
            const s = S[i];
            if (s.t == "learn") { i++; return render() }
            if (done) { if (hearts <= 0) return render(); if (ft.className == "no") { fb.textContent = ""; } i++; return render() }
            if (s.t == "mc" || s.t == "word") {
                const ok = +sel == s.a;
                [...$("ops").children].forEach(c => { if (+c.dataset.k == s.a) c.classList.add("ok"); else if (c.classList.contains("sel")) c.classList.add("no") });
                check(ok);
            } else if (s.t == "build") {
                const w = built.map(k => s.tiles[k]).join(""); check(w == s.w);
                if (w != s.w) fb.textContent = "Incorrecto. La respuesta es: " + s.w;
            }
        };
        function end(win) {
            ft.className = ""; fb.textContent = ""; $("pb").style.width = win ? "100%" : $("pb").style.width;
            main.innerHTML = '<div class="end"><div class="big">' + (win ? "🦎" : "💔") + '</div><h1>' + (win ? "¡Lección completada!" : "Te quedaste sin vidas") + '</h1><p class="sub">' + (win ? "Ganaste " + xp + " XP" : "Inténtalo de nuevo") + '</p></div>';
            go.disabled = false; go.textContent = "Practicar otra vez";
            go.onclick = () => { i = 0; hearts = 5; xp = 0; go.onclick = mainGo; render() };
        }
        const mainGo = go.onclick;
        render();
    </script>
</body>

</html>
